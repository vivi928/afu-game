<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>外送大叔的逆襲 - 手機真流暢版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none !important;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 頂部極簡 HUD */
    #top-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .hud-col {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }
    .pill {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .gold-txt { color: #f59e0b; }
    .green-txt { color: #10b981; }

    /* 導航提示卡 */
    #nav-toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 25;
      display: none;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 派單彈窗 */
    #order-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 86%;
      max-width: 320px;
      background: #1e293b;
      border: 3px solid #f59e0b;
      border-radius: 20px;
      padding: 18px;
      z-index: 50;
      display: none;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }
    #order-card h3 {
      font-size: 18px;
      color: #f59e0b;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .order-content {
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 16px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-ui {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-yes { background: #10b981; color: white; }
    .btn-no { background: #475569; color: #cbd5e1; }

    /* 右下角大按鈕組（防誤觸、支援多點觸控） */
    #action-zone {
      position: absolute;
      bottom: 24px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      pointer-events: auto;
    }
    .action-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #64748b;
      background: rgba(30, 41, 59, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      font-weight: 900;
      font-size: 13px;
    }
    .action-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
    .btn-interact {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-color: #fbbf24;
      width: 80px;
      height: 80px;
      font-size: 15px;
    }

    /* 手指拖曳視覺圓圈 */
    #touch-indicator {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.8);
      background: rgba(245, 158, 11, 0.2);
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
      z-index: 15;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 頂部 HUD -->
  <div id="top-hud">
    <div class="hud-col">
      <div class="pill">💰 <span id="txt-money" class="gold-txt">200</span></div>
      <div class="pill">⚡ <span id="txt-hp" class="green-txt">100%</span></div>
    </div>
    <div class="hud-col">
      <div class="pill"><span id="txt-timer">12:00</span></div>
      <div class="pill"><span id="txt-sound" onclick="toggleAudio()">🔊</span></div>
    </div>
  </div>

  <div id="nav-toast">📍 請前往【紅麵線】取餐！</div>
  <div id="touch-indicator"></div>

  <!-- 畫布 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 派單彈窗 -->
  <div id="order-card">
    <h3>
      <span id="order-brand">🛵 粉熊外送</span>
      <span id="order-pay" class="gold-txt">+NT$ 85</span>
    </h3>
    <div class="order-content">
      <div>店家：<b id="order-store">樹林紅麵線</b></div>
      <div>送往：<b id="order-addr">文林街公寓</b></div>
      <div style="font-size: 12px; color: #38bdf8; margin-top: 5px;">⏱️ 限時 45 秒！提早送達多給小費！</div>
    </div>
    <div class="btn-row">
      <button class="btn-ui btn-no" onclick="onRejectOrder(event)">拒絕</button>
      <button class="btn-ui btn-yes" onclick="onAcceptOrder(event)">接單</button>
    </div>
  </div>

  <!-- 操作按鈕 -->
  <div id="action-zone">
    <button class="action-btn" onclick="onEatBento(event)">
      <span>🍱</span>
      <span>便當 (<span id="bento-qty">2</span>)</span>
    </button>
    <button class="action-btn btn-interact" onclick="onInteract(event)">
      <span>取 / 送</span>
      <span style="font-size: 10px; opacity: 0.8;">[點我]</span>
    </button>
  </div>
</div>

<script>
  /* 阻止手機原生拖曳縮放 */
  document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

  /* 簡易原生音效 */
  let actx = null;
  let soundEnabled = true;
  function initAudio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  function toggleAudio() {
    soundEnabled = !soundEnabled;
    document.getElementById('txt-sound').innerText = soundEnabled ? '🔊' : '🔇';
  }
  function playBeep(freq, type = 'sine', duration = 0.15) {
    if (!soundEnabled) return;
    initAudio();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(0.2, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + duration);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + duration);
  }

  /* 畫布適配 */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* 狀態 */
  const state = { money: 200, hp: 100, bento: 2, time: 720 };
  const player = { x: 1000, y: 1000, r: 22, angle: 0, speed: 4.2, vx: 0, vy: 0, order: null };

  const places = {
    station: { x: 740, y: 780, w: 130, h: 70, name: '樹林車站', type: 'landmark', icon: '🚉' },
    noodle: { x: 920, y: 880, w: 70, h: 70, name: '紅麵線', type: 'shop', icon: '🍜' },
    bento: { x: 1140, y: 920, w: 70, h: 70, name: '阿堂便當', type: 'shop', icon: '🍱' },
    apt: { x: 820, y: 1250, w: 80, h: 80, name: '文林公寓', type: 'target', icon: '🏢' },
    home: { x: 1250, y: 1220, w: 75, h: 75, name: '溫馨小窩', type: 'home', icon: '🏠' }
  };

  /* 手機任意處觸控移動 */
  let moveTouchId = null;
  let moveOrigin = { x: 0, y: 0 };
  const touchDot = document.getElementById('touch-indicator');

  canvas.addEventListener('touchstart', (e) => {
    initAudio();
    if (moveTouchId !== null) return;
    const t = e.changedTouches[0];
    moveTouchId = t.identifier;
    moveOrigin = { x: t.clientX, y: t.clientY };
    touchDot.style.left = `${t.clientX}px`;
    touchDot.style.top = `${t.clientY}px`;
    touchDot.style.display = 'block';
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === moveTouchId) {
        const dx = t.clientX - moveOrigin.x;
        const dy = t.clientY - moveOrigin.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 10) {
          const angle = Math.atan2(dy, dx);
          player.vx = Math.cos(angle) * player.speed;
          player.vy = Math.sin(angle) * player.speed;
          player.angle = angle;
          touchDot.style.left = `${t.clientX}px`;
          touchDot.style.top = `${t.clientY}px`;
        }
      }
    }
  }, { passive: false });

  function stopTouch(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === moveTouchId) {
        moveTouchId = null;
        touchDot.style.display = 'none';
        player.vx = 0;
        player.vy = 0;
      }
    }
  }
  canvas.addEventListener('touchend', stopTouch);
  canvas.addEventListener('touchcancel', stopTouch);

  /* 電腦鍵盤相容 */
  const keys = {};
  window.addEventListener('keydown', (e) => {
    initAudio();
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'y' || e.key === 'Y') onAcceptOrder();
    if (e.key === 'n' || e.key === 'N') onRejectOrder();
    if (e.key === 'b' || e.key === 'B') onEatBento();
    if (e.key === 'e' || e.key === 'E' || e.key === ' ') onInteract();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  /* 外送派單循環 */
  let pending = null;
  function tryNewOrder() {
    if (pending || player.order) return;
    pending = {
      brand: Math.random() > 0.5 ? '🛵 粉熊外送' : '🟢 U 外送',
      shop: places.noodle,
      target: places.apt,
      reward: 80,
      timer: 45
    };
    document.getElementById('order-brand').innerText = pending.brand;
    document.getElementById('order-store').innerText = pending.shop.name;
    document.getElementById('order-addr').innerText = pending.target.name;
    document.getElementById('order-pay').innerText = `+NT$ ${pending.reward}`;
    document.getElementById('order-card').style.display = 'block';
    playBeep(600, 'triangle', 0.2);
  }
  setInterval(tryNewOrder, 10000);

  function onAcceptOrder(e) {
    if (e) e.stopPropagation();
    if (!pending) return;
    player.order = { ...pending, stage: 'pickup' };
    pending = null;
    document.getElementById('order-card').style.display = 'none';
    showToast(`📦 請前往【${player.order.shop.name}】取餐！`);
    playBeep(880, 'sine', 0.2);
  }

  function onRejectOrder(e) {
    if (e) e.stopPropagation();
    pending = null;
    document.getElementById('order-card').style.display = 'none';
  }

  function showToast(txt) {
    const t = document.getElementById('nav-toast');
    t.innerText = txt;
    t.style.display = 'block';
  }

  function onEatBento(e) {
    if (e) e.stopPropagation();
    if (state.bento > 0 && state.hp < 100) {
      state.bento--;
      state.hp = Math.min(100, state.hp + 40);
      document.getElementById('bento-qty').innerText = state.bento;
      document.getElementById('txt-hp').innerText = `${state.hp}%`;
      playBeep(440, 'triangle', 0.1);
      showToast('🍱 體力恢復 40%！');
    }
  }

  function onInteract(e) {
    if (e) e.stopPropagation();
    if (!player.order) {
      showToast('⚠️ 目前沒有正在進行的訂單！');
      return;
    }
    const ord = player.order;
    if (ord.stage === 'pickup') {
      const d = Math.hypot(player.x - (ord.shop.x + ord.shop.w / 2), player.y - (ord.shop.y + ord.shop.h / 2));
      if (d < 80) {
        ord.stage = 'deliver';
        playBeep(900, 'sine', 0.2);
        showToast(`🚀 已取餐！請送往【${ord.target.name}】！`);
      } else {
        showToast('📍 還沒到達店家取餐點喔！');
      }
    } else if (ord.stage === 'deliver') {
      const d = Math.hypot(player.x - (ord.target.x + ord.target.w / 2), player.y - (ord.target.y + ord.target.h / 2));
      if (d < 80) {
        state.money += ord.reward;
        player.order = null;
        document.getElementById('txt-money').innerText = state.money;
        document.getElementById('nav-toast').style.display = 'none';
        playBeep(1046, 'sine', 0.3);
        alert(`🎉 配送成功！獲得 NT$ ${ord.reward}！`);
      } else {
        showToast('📍 還沒到達顧客位置喔！');
      }
    }
  }

  /* 主迴圈 */
  function loop() {
    if (moveTouchId === null) {
      let kx = 0, ky = 0;
      if (keys['w'] || keys['arrowup']) ky -= 1;
      if (keys['s'] || keys['arrowdown']) ky += 1;
      if (keys['a'] || keys['arrowleft']) kx -= 1;
      if (keys['d'] || keys['arrowright']) kx += 1;
      if (kx !== 0 || ky !== 0) {
        const ang = Math.atan2(ky, kx);
        player.vx = Math.cos(ang) * player.speed;
        player.vy = Math.sin(ang) * player.speed;
        player.angle = ang;
      } else {
        player.vx *= 0.8;
        player.vy *= 0.8;
      }
    }

    player.x += player.vx;
    player.y += player.vy;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const camX = canvas.width / 2 - player.x;
    const camY = canvas.height / 2 - player.y;

    ctx.save();
    ctx.translate(camX, camY);

    // 道路底圖
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(500, 500, 1100, 1100);

    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 60;
    ctx.beginPath();
    ctx.moveTo(600, 920); ctx.lineTo(1500, 920);
    ctx.moveTo(1000, 600); ctx.lineTo(1000, 1500);
    ctx.stroke();

    // 建築物
    for (let k in places) {
      const p = places[k];
      ctx.fillStyle = p.type === 'shop' ? '#d97706' : (p.type === 'home' ? '#2563eb' : '#059669');
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 10);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`${p.icon} ${p.name}`, p.x + 6, p.y + p.h / 2 + 5);
    }

    // 引導光圈
    if (player.order) {
      const tgt = player.order.stage === 'pickup' ? player.order.shop : player.order.target;
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(tgt.x + tgt.w / 2, tgt.y + tgt.h / 2, 40 + Math.sin(Date.now() / 200) * 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 大叔繪製 (含轉向)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    // 機車輪子與車身
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-20, -7, 12, 14);
    ctx.fillRect(12, -7, 10, 14);

    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.roundRect(-14, -10, 30, 20, 5);
    ctx.fill();

    // 保溫箱
    ctx.fillStyle = player.order ? '#10b981' : '#f59e0b';
    ctx.beginPath();
    ctx.roundRect(-22, -12, 14, 24, 3);
    ctx.fill();

    // 黑背心大叔
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(2, 0, 12, 0, Math.PI * 2);
    ctx.fill();

    // 頭與黑框眼鏡
    ctx.fillStyle = '#fed7aa';
    ctx.beginPath();
    ctx.arc(4, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(6, -5, 4, 3);
    ctx.strokeRect(6, 2, 4, 3);

    ctx.restore();
    ctx.restore();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
