<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>外送大叔的逆襲 - 旗艦滑順版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 頂部 HUD：精緻膠囊列 */
    #top-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .hud-col {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .gold-txt { color: #f59e0b; }
    .green-txt { color: #10b981; }

    /* 導航提示大標 */
    #nav-toast {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      z-index: 25;
      display: none;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 派單彈窗 */
    #order-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      max-width: 340px;
      background: #1e293b;
      border: 3px solid #f59e0b;
      border-radius: 24px;
      padding: 20px;
      z-index: 50;
      display: none;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    #order-card h3 {
      font-size: 19px;
      color: #f59e0b;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .order-content {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-ui {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-yes { background: #10b981; color: white; }
    .btn-no { background: #475569; color: #cbd5e1; }

    /* 右下角操作按鍵（支援與拖曳同時觸碰） */
    #action-zone {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 30;
      pointer-events: auto;
    }
    .action-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #475569;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(4px);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      font-weight: 900;
      font-size: 13px;
    }
    .action-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
    .btn-interact {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-color: #fbbf24;
      width: 82px;
      height: 82px;
      font-size: 15px;
    }

    /* 手指任意滑動提示指引圈 */
    #touch-thumb-track {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px dashed rgba(245, 158, 11, 0.6);
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
      z-index: 15;
    }
    #touch-thumb-knob {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.9);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.8);
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
      z-index: 16;
    }

    /* 警報提示 */
    #hurt-alert {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      color: white;
      font-weight: 900;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 20px;
      display: none;
      z-index: 28;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 頂部 HUD -->
  <div id="top-hud">
    <div class="hud-col">
      <div class="pill">💰 <span id="txt-money" class="gold-txt">200</span></div>
      <div class="hud-col">
        <div class="pill">⚡ <span id="txt-hp" class="green-txt">100%</span></div>
      </div>
    </div>
    <div class="hud-col">
      <div class="pill"><span id="txt-timer">12:00</span></div>
      <div class="pill"><span id="txt-sound" onclick="toggleAudio()">🔊</span></div>
    </div>
  </div>

  <div id="nav-toast">📍 請前往【紅麵線】取餐！</div>
  <div id="hurt-alert">⚠️ 撞到行人！體力 -15！</div>

  <!-- 任意滑動觸控引導圈 -->
  <div id="touch-thumb-track"></div>
  <div id="touch-thumb-knob"></div>

  <!-- 遊戲畫布 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 接單卡片 -->
  <div id="order-card">
    <h3>
      <span id="order-brand">🛵 粉熊外送</span>
      <span id="order-pay" class="gold-txt">+NT$ 85</span>
    </h3>
    <div class="order-content">
      <div>店家：<b id="order-store">樹林紅麵線</b></div>
      <div>送往：<b id="order-addr">文林街公寓 (電梯)</b></div>
      <div style="font-size: 13px; color: #38bdf8; margin-top: 6px;">⏱️ 限時 45 秒！提早送達享早鳥小費！</div>
    </div>
    <div class="btn-row">
      <button class="btn-ui btn-no" onclick="onRejectOrder()">拒絕 [N]</button>
      <button class="btn-ui btn-yes" onclick="onAcceptOrder()">接單 [Y]</button>
    </div>
  </div>

  <!-- 獨立操作大按鈕（不與滑動移動打架） -->
  <div id="action-zone">
    <button class="action-btn" onclick="onEatBento()">
      <span>🍱</span>
      <span>便當 (<span id="bento-qty">2</span>)</span>
    </button>
    <button class="action-btn btn-interact" onclick="onInteract()">
      <span>取 / 送</span>
      <span style="font-size: 10px; opacity: 0.8;">[空白/E]</span>
    </button>
  </div>
</div>

<script>
  /* ================= 1. Web Audio 原生音效引擎（無外部檔案，免依賴） ================= */
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!actx) actx = new AudioContext();
    if (actx.state === 'suspended') actx.resume();
  }
  function toggleAudio() {
    soundEnabled = !soundEnabled;
    document.getElementById('txt-sound').innerText = soundEnabled ? '🔊' : '🔇';
  }

  function sfxCoin() {
    if (!soundEnabled) return; initAudio();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, actx.currentTime);
    osc.frequency.setValueAtTime(1318.51, actx.currentTime + 0.08);
    g.gain.setValueAtTime(0.3, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.35);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.35);
  }

  function sfxPing() {
    if (!soundEnabled) return; initAudio();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046.5, actx.currentTime + 0.15);
    g.gain.setValueAtTime(0.3, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.2);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.2);
  }

  function sfxHit() {
    if (!soundEnabled) return; initAudio();
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.3);
    g.gain.setValueAtTime(0.5, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.3);
    osc.connect(g); g.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + 0.3);
  }

  function sfxMunch() {
    if (!soundEnabled) return; initAudio();
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220 + Math.random() * 80, actx.currentTime);
        g.gain.setValueAtTime(0.2, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
        osc.connect(g); g.connect(actx.destination);
        osc.start(); osc.stop(actx.currentTime + 0.08);
      }, i * 70);
    }
  }

  /* ================= 2. 畫布與視窗尺寸 ================= */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ================= 3. 遊戲狀態與主角 ================= */
  const state = {
    money: 200,
    hp: 100,
    bento: 2,
    time: 720,
    speedBoostTimer: 0
  };

  const player = {
    x: 1000,
    y: 1000,
    r: 22,
    angle: 0,
    baseSpeed: 4.0,
    vx: 0,
    vy: 0,
    order: null
  };

  // 行人
  const peds = [
    { x: 960, y: 920, r: 16, vx: 0.7, vy: 0, name: '買菜阿姨', color: '#f43f5e' },
    { x: 1080, y: 1050, r: 16, vx: -0.6, vy: 0.5, name: '放學學生', color: '#06b6d4' },
    { x: 890, y: 1120, r: 16, vx: 0.4, vy: -0.7, name: '散步阿伯', color: '#84cc16' }
  ];

  // 地標
  const places = {
    station: { x: 720, y: 780, w: 140, h: 80, name: '樹林車站', type: 'landmark', icon: '🚉' },
    noodle: { x: 920, y: 880, w: 75, h: 75, name: '紅麵線', type: 'shop', icon: '🍜' },
    bento: { x: 1140, y: 920, w: 75, h: 75, name: '阿堂便當', type: 'shop', icon: '🍱' },
    apt: { x: 820, y: 1250, w: 90, h: 90, name: '文林公寓', type: 'target', icon: '🏢' },
    home: { x: 1260, y: 1220, w: 80, h: 80, name: '大叔的家', type: 'home', icon: '🏠' }
  };

  /* ================= 4. 手機任意滑動控制（多點觸控完美支援） ================= */
  let moveTouchId = null;
  let touchStart = { x: 0, y: 0 };
  const trackCircle = document.getElementById('touch-thumb-track');
  const knobCircle = document.getElementById('touch-thumb-knob');

  window.addEventListener('touchstart', (e) => {
    initAudio();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      // 若點在右下角動作按鈕區，則不觸發移動
      const actionZone = document.getElementById('action-zone').getBoundingClientRect();
      const isInsideAction = t.clientX >= actionZone.left && t.clientX <= actionZone.right &&
                             t.clientY >= actionZone.top && t.clientY <= actionZone.bottom;

      if (!isInsideAction && moveTouchId === null) {
        moveTouchId = t.identifier;
        touchStart = { x: t.clientX, y: t.clientY };
        trackCircle.style.left = `${t.clientX}px`;
        trackCircle.style.top = `${t.clientY}px`;
        trackCircle.style.display = 'block';

        knobCircle.style.left = `${t.clientX}px`;
        knobCircle.style.top = `${t.clientY}px`;
        knobCircle.style.display = 'block';
      }
    }
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === moveTouchId) {
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;
        const angle = Math.atan2(dy, dx);
        const cap = Math.min(dist, maxDist);

        knobCircle.style.left = `${touchStart.x + Math.cos(angle) * cap}px`;
        knobCircle.style.top = `${touchStart.y + Math.sin(angle) * cap}px`;

        const spd = (player.baseSpeed + (state.speedBoostTimer > 0 ? 2.5 : 0)) * (cap / maxDist);
        player.vx = Math.cos(angle) * spd;
        player.vy = Math.sin(angle) * spd;
        player.angle = angle;
      }
    }
  }, { passive: false });

  function endTouch(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === moveTouchId) {
        moveTouchId = null;
        trackCircle.style.display = 'none';
        knobCircle.style.display = 'none';
        player.vx = 0;
        player.vy = 0;
      }
    }
  }
  window.addEventListener('touchend', endTouch);
  window.addEventListener('touchcancel', endTouch);

  /* 鍵盤操作相容 */
  const keys = {};
  window.addEventListener('keydown', (e) => {
    initAudio();
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'y' || e.key === 'Y') onAcceptOrder();
    if (e.key === 'n' || e.key === 'N') onRejectOrder();
    if (e.key === 'b' || e.key === 'B') onEatBento();
    if (e.key === 'e' || e.key === 'E' || e.key === ' ') onInteract();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  /* ================= 5. 外送系統與事件 ================= */
  let currentPending = null;
  function triggerOrder() {
    if (currentPending || player.order) return;
    const base = 75 + Math.floor(Math.random() * 20);
    currentPending = {
      brand: Math.random() > 0.5 ? '🛵 粉熊外送' : '🟢 U 外送',
      shop: places.noodle,
      target: places.apt,
      reward: base,
      timeLimit: 45
    };
    document.getElementById('order-brand').innerText = currentPending.brand;
    document.getElementById('order-store').innerText = currentPending.shop.name;
    document.getElementById('order-addr').innerText = currentPending.target.name;
    document.getElementById('order-pay').innerText = `+NT$ ${currentPending.reward}`;
    document.getElementById('order-card').style.display = 'block';
    sfxPing();
  }
  setInterval(triggerOrder, 11000);

  function onAcceptOrder() {
    if (!currentPending) return;
    player.order = { ...currentPending, stage: 'pickup', timer: currentPending.timeLimit };
    currentPending = null;
    document.getElementById('order-card').style.display = 'none';
    showToast(`📦 請前往【${player.order.shop.name}】取餐！`);
    sfxCoin();
  }
  function onRejectOrder() {
    currentPending = null;
    document.getElementById('order-card').style.display = 'none';
  }

  function showToast(txt) {
    const t = document.getElementById('nav-toast');
    t.innerText = txt;
    t.style.display = 'block';
  }

  function onEatBento() {
    if (state.bento > 0 && state.hp < 100) {
      state.bento--;
      state.hp = Math.min(100, state.hp + 40);
      state.speedBoostTimer = 35; // 35 秒加速暴走
      document.getElementById('bento-qty').innerText = state.bento;
      updateUI();
      sfxMunch();
      showToast('🍱 狂扒便當！體力恢復，開啟暴走加速 35 秒！');
    }
  }

  function onInteract() {
    if (!player.order) return;
    const ord = player.order;
    if (ord.stage === 'pickup') {
      const d = Math.hypot(player.x - (ord.shop.x + ord.shop.w / 2), player.y - (ord.shop.y + ord.shop.h / 2));
      if (d < 75) {
        ord.stage = 'deliver';
        sfxPing();
        showToast(`🚀 已成功取餐！送往【${ord.target.name}】！`);
      }
    } else if (ord.stage === 'deliver') {
      const d = Math.hypot(player.x - (ord.target.x + ord.target.w / 2), player.y - (ord.target.y + ord.target.h / 2));
      if (d < 75) {
        const bonus = ord.timer > 20 ? 30 : 0; // 早鳥小費
        state.money += ord.reward + bonus;
        player.order = null;
        updateUI();
        sfxCoin();
        document.getElementById('nav-toast').style.display = 'none';
        alert(`🎉 配送成功！獲得薪資 NT$ ${ord.reward}${bonus > 0 ? ' + 早鳥小費 NT$ 30' : ''}！`);
      }
    }
  }

  function updateUI() {
    document.getElementById('txt-money').innerText = state.money;
    document.getElementById('txt-hp').innerText = `${state.hp}%`;
  }

  /* 倒數計時 */
  setInterval(() => {
    state.time = (state.time + 1) % 1440;
    const h = String(Math.floor(state.time / 60)).padStart(2, '0');
    const m = String(state.time % 60).padStart(2, '0');
    document.getElementById('txt-timer').innerText = `${h}:${m}`;

    if (state.speedBoostTimer > 0) state.speedBoostTimer--;
    if (player.order && player.order.timer > 0) player.order.timer--;
  }, 1000);

  /* ================= 6. 幾何碰撞檢驗（真實撞人） ================= */
  let hurtCooldown = 0;
  function checkHurt() {
    if (hurtCooldown > 0) { hurtCooldown--; return; }
    for (let p of peds) {
      const dx = player.x - p.x;
      const dy = player.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < player.r + p.r) {
        state.hp = Math.max(0, state.hp - 15);
        updateUI();
        sfxHit();

        player.vx = (dx / dist) * 7;
        player.vy = (dy / dist) * 7;
        hurtCooldown = 60;

        const alertBox = document.getElementById('hurt-alert');
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 1500);
        break;
      }
    }
  }

  /* ================= 7. 渲染大叔與街道 ================= */
  function drawUncle(ctx, x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 噴氣與輪胎
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-22, -8, 14, 16); // 後輪
    ctx.fillRect(14, -8, 12, 16);  // 前輪

    // 機車本體 (經典台灣外送藍)
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.roundRect(-16, -12, 34, 24, 6);
    ctx.fill();

    // 保溫外送大箱
    ctx.fillStyle = player.order ? '#10b981' : '#f59e0b';
    ctx.beginPath();
    ctx.roundRect(-24, -14, 16, 28, 4);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText('FOOD', -23, 4);

    // 大叔身體（招牌黑背心）
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(2, 0, 13, 0, Math.PI * 2);
    ctx.fill();

    // 手臂與手把
    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(4, -16, 8, 4);
    ctx.fillRect(4, 12, 8, 4);

    // 大叔頭部
    ctx.fillStyle = '#fed7aa';
    ctx.beginPath();
    ctx.arc(4, 0, 9, 0, Math.PI * 2);
    ctx.fill();

    // 黑框眼鏡
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(6, -6, 5, 4);
    ctx.strokeRect(6, 2, 5, 4);

    ctx.restore();
  }

  /* 主迴圈 */
  function loop() {
    // 鍵盤操控補正
    if (moveTouchId === null) {
      let kx = 0, ky = 0;
      if (keys['w'] || keys['arrowup']) ky -= 1;
      if (keys['s'] || keys['arrowdown']) ky += 1;
      if (keys['a'] || keys['arrowleft']) kx -= 1;
      if (keys['d'] || keys['arrowright']) kx += 1;

      if (kx !== 0 || ky !== 0) {
        const ang = Math.atan2(ky, kx);
        const spd = player.baseSpeed + (state.speedBoostTimer > 0 ? 2.5 : 0);
        player.vx = Math.cos(ang) * spd;
        player.vy = Math.sin(ang) * spd;
        player.angle = ang;
      } else {
        player.vx *= 0.8;
        player.vy *= 0.8;
      }
    }

    player.x += player.vx;
    player.y += player.vy;

    // 行人散步巡邏
    peds.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 850 || p.x > 1150) p.vx *= -1;
      if (p.y < 850 || p.y > 1150) p.vy *= -1;
    });

    checkHurt();

    /* 渲染畫面 */
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const camX = canvas.width / 2 - player.x;
    const camY = canvas.height / 2 - player.y;

    ctx.save();
    ctx.translate(camX, camY);

    // 街區柏油底
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(500, 500, 1100, 1100);

    // 柏油馬路與黃虛線
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 60;
    ctx.beginPath();
    ctx.moveTo(600, 920); ctx.lineTo(1500, 920);
    ctx.moveTo(1000, 600); ctx.lineTo(1000, 1500);
    ctx.stroke();

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.setLineDash([15, 15]);
    ctx.beginPath();
    ctx.moveTo(600, 920); ctx.lineTo(1500, 920);
    ctx.moveTo(1000, 600); ctx.lineTo(1000, 1500);
    ctx.stroke();
    ctx.setLineDash([]);

    // 建築物地標
    for (let k in places) {
      const p = places[k];
      ctx.fillStyle = p.type === 'shop' ? '#d97706' : (p.type === 'home' ? '#2563eb' : '#059669');
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 12);
      ctx.fill();

      // 招牌
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`${p.icon} ${p.name}`, p.x + 8, p.y + p.h / 2 + 5);
    }

    // 導航引導光圈
    if (player.order) {
      const tgt = player.order.stage === 'pickup' ? player.order.shop : player.order.target;
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(tgt.x + tgt.w / 2, tgt.y + tgt.h / 2, 40 + Math.sin(Date.now() / 180) * 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 繪製行人
    peds.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(p.name, p.x - 20, p.y - 18);
    });

    // 繪製大叔（阿豪）
    drawUncle(ctx, player.x, player.y, player.angle);

    ctx.restore();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
