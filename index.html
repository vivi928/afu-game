<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>外送大叔的逆襲</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d16;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;overflow:hidden}
#game{height:100dvh;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}

/* 頂部 HUD */
#hud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;pointer-events:none;z-index:20}

/* 頂部按鈕列 */

/* 精準導航指示 (含箭頭與公尺距離) */
#nav{position:absolute;top:82px;left:50%;transform:translateX(-50%);background:#064e3bee;border:1.5px solid #34d399;color:#a7f3d0;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap;display:none;align-items:center;gap:6px;z-index:20;box-shadow:0 4px 15px rgba(0,0,0,0.6)}
#navArrow{display:inline-block;transition:transform 0.05s linear;font-size:14px}

/* 左下虛擬搖桿 */
#stick{position:absolute;bottom:16px;left:14px;width:96px;height:96px;border:2px dashed rgba(255,255,255,0.3);border-radius:50%;background:rgba(255,255,255,0.08);touch-action:none;z-index:30}
#knob{position:absolute;left:50%;top:50%;width:38px;height:38px;background:#f59e0b;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px rgba(245,158,11,0.6)}

/* 右下操作按鍵 */
#actions{position:absolute;right:10px;bottom:14px;display:grid;grid-template-columns:repeat(2,64px);gap:8px;z-index:30}
#actions button{min-height:50px;border-radius:14px;background:#1e293bee;border:1.5px solid #64748b;color:#fff;font-size:11px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#actions button:active{transform:scale(0.92)}
#interact{grid-column:span 2;background:linear-gradient(135deg,#059669,#10b981)!important;border-color:#34d399!important;height:46px;font-size:13px!important}

/* 彈窗遮罩 */
.overlay{position:fixed;inset:0;background:rgba(2,6,23,0.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
.overlay.show{display:flex}
.card{width:min(100%,480px);max-height:86dvh;overflow-y:auto;background:#0f172a;border:2px solid #f59e0b;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,0.8)}
.card h2{color:#fbbf24;margin-top:0;font-size:18px}
.card p{line-height:1.6;font-size:13px;color:#cbd5e1}
.card button{width:100%;margin:6px 0;padding:10px;border-radius:12px;background:#1e293b;border:1px solid #475569;color:#fff;font-weight:bold;cursor:pointer}
.card button.primary{background:#047857;border-color:#10b981}

/* 提示通知條 */
#toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:#1e293bee;border:1.5px solid #f59e0b;color:#fde68a;padding:7px 16px;border-radius:12px;display:none;z-index:50;font-size:12px;font-weight:bold;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.8)}

/* 新手教學任務引導卡 */
#questCard{position:absolute;left:10px;top:82px;background:rgba(15,23,42,0.9);border:1.5px solid #fbbf24;border-radius:12px;padding:8px 12px;font-size:11px;z-index:20;max-width:180px;pointer-events:none}
</style>

<body>

<!-- 1. 開場角色自訂（性別、生日、星座） -->
<div class="overlay show" id="creatorModal"><div class="card">
<h2>🛵 建立你的外送主角</h2>
<p>歡迎來到樹林街頭！請先選擇你的角色性別與出生日期：</p>

</div>
<div style="margin:10px 0;">

  <input type="date" id="birthInput" value="1992-05-18" style="width:100%;padding:8px;border-radius:10px;background:#1e293b;border:1px solid #475569;color:#fff;">
</div>
<div id="zodiacHint" style="font-size:11px;color:#38bdf8;margin:8px 0;">金牛座天賦：體力消耗減緩 10%，耐摔耐撞。</div>

</div></div>

<!-- 2. 故事與【直接選擇關卡】彈窗 -->
<div class="overlay" id="storyModal"><div class="card">
<h2 id="storyTitle">第一章：今天也要活下去</h2>

<div style="margin:12px 0;padding:10px;background:#1e293b;border-radius:12px;border:1px solid #334155;">

<!-- 3. 外送派單 -->
<div class="overlay" id="orderModal"><div class="card">
<h2>📲 外送新訂單來了！</h2>
<p id="orderDesc"></p>
<p id="reward" style="font-size:16px;color:#34d399;font-weight:900;"></p>
<button class="primary" onclick="accept()">接受訂單 [Y]</button>

</div></div>

<!-- 4. 阿豪小窩內部 -->
<div class="overlay" id="homeModal"><div class="card">
<h2>🏠 溫馨小窩</h2>
<p>暫時放下安全帽，好好放鬆一下。</p>
<button class="primary" onclick="sleepHome()">🛌 睡覺（體力、車損、汽油回滿）</button>

<!-- 5. 改裝車行 (購買新車) -->
<div class="overlay" id="garageModal"><div class="card">
<h2>🔧 順發機車行</h2>

<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">
  <button onclick="buyVehicle(1, 200)">🚲 升級 變速公路車 ($200) - 極速 +30%</button>
  <button onclick="buyVehicle(2, 600)">🛵 升級 125cc 勁戰神車 ($600) - 極速 +80%、耐撞度翻倍</button>

<button data-close="garageModal">離開車行</button>
</div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('world'),ctx=canvas.getContext('2d');
let W,H,dpr=1,last=0;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();

/* ================= 1. 耐聽、舒緩的無版權 Lo-Fi 背景音樂 (Web Audio API) ================= */
let audioCtx = null;
let bgmTimer = null;
let isMusicOn = false;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// 柔和 Lo-Fi 和弦音符（低通濾波，溫暖不刺耳）
const lofiChords = [
  [261.63, 329.63, 392.00], // C
  [220.00, 261.63, 329.63], // Am
  [174.61, 220.00, 261.63], // F
  [196.00, 246.94, 293.66]  // G
];
let chordIdx = 0;

function playLoFiChord() {
  if (!isMusicOn || !audioCtx) return;
  const chord = lofiChords[chordIdx % lofiChords.length];
  chordIdx++;

  chord.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sine'; // 柔和正弦波
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    // 溫暖低通濾波
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(450, audioCtx.currentTime);

    // 輕柔淡入淡出
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.02, audioCtx.currentTime + 0.4 + i*0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.8);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 2.9);
  });
}

function toggleLoFiBGM() {
  initAudio();
  isMusicOn = !isMusicOn;
  if (isMusicOn) {
    $('musicBtn').textContent = '🎵 輕音樂：開';
    playLoFiChord();
    bgmTimer = setInterval(playLoFiChord, 3000); // 每 3 秒切換一組柔和和弦
  } else {
    $('musicBtn').textContent = '🎵 輕音樂：關';
    clearInterval(bgmTimer);
  }
}
window.toggleLoFiBGM = toggleLoFiBGM;

// 撞擊沉悶音效
function playHitSound() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(140, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

/* ================= 2. 狀態與玩家設定 ================= */
const map = { w: 2200, h: 1700 };

const player = {
  x: 330, y: 330,
  speed: 175,
  angle: 0,
  gender: 'M',
  target: null,
  money: 200,
  hp: 100,
  durability: 100, // 車損 (耐久度)
  gas: 100,
  bento: 2,
  done: 0,
  order: null,
  vehLvl: 0
};

// 年月日時鐘
let gameYear = 2026, gameMonth = 1, gameDay = 1, gameMinutes = 480;

// 新手教學任務步驟
const quests = [
  "1. 探索街頭並用【珍奶】引開野狗",
  "2. 體驗一次擦撞車輛，感受車損與體力扣減",
  "3. 按【B】吃便當補充體力",
  "4. 接一張外送單並前往取餐送達",
  "5. 騎到【加油站】將汽油加滿",
  "6. 賺夠錢前往【順發機車行】換新車！"
];
let questStep = 0;
function advanceQuest(step) {
  if (questStep === step - 1) {
    questStep = step;
    if (questStep < quests.length) {
      $('questDesc').textContent = quests[questStep];
      toast('🎯 新手教學進度更新！');
    } else {
      $('questDesc').textContent = '🎉 已通關全部新手練習！';
      toast('🏆 恭喜成為合格的街頭外送騎士！');
    }
  }
}

const places = [
  { x: 180, y: 220, w: 130, h: 80, name: '阿豪小窩', type: 'home', icon: '🏠' },
  { x: 430, y: 650, w: 130, h: 75, name: '樹林麵線店', type: 'shop', icon: '🍜' },
  { x: 1050, y: 300, w: 130, h: 75, name: '阿堂便當店', type: 'shop', icon: '🍱' },
  { x: 1390, y: 850, w: 130, h: 80, name: '加油站', type: 'gas', icon: '⛽' },
  { x: 770, y: 1190, w: 140, h: 85, name: '文林公寓', type: 'target', icon: '🏢' },
  { x: 1770, y: 1060, w: 150, h: 90, name: '帝寶豪宅', type: 'target', icon: '🏙️' },
  { x: 1100, y: 1200, w: 130, h: 80, name: '順發機車行', type: 'garage', icon: '🔧' }
];

const dogs = [
  { x: 650, y: 800, v: 45, stun: 0 },
  { x: 1460, y: 580, v: -40, stun: 0 }
];

// 馬路車潮
const cars = Array.from({ length: 8 }, (_, i) => ({
  x: 100 + i * 260,
  y: 520 + (i % 2) * 50,
  v: (i % 2 ? 1 : -1) * (85 + (i % 3) * 15),
  w: 42, h: 20,
  color: ['#38bdf8', '#f59e0b', '#ef4444', '#10b981'][i % 4]
}));

const weapons = [
  { name: '珍奶', icon: '🧋', qty: 3, stun: 4 },
  { name: '雞排', icon: '🍗', qty: 2, stun: 8 },
  { name: '貢丸', icon: '🍢', qty: 5, stun: 3 }
];
let wi = 0, foods = [], keys = {}, joy = { on: false, x: 0, y: 0 };

/* ================= 3. 開場自訂與關卡篇章 ================= */
function setGender(g) {
  player.gender = g;
  $('genderM').className = g === 'M' ? 'primary' : '';
  $('genderF').className = g === 'F' ? 'primary' : '';
}
window.setGender = setGender;

function finishCreator() {
  initAudio();
  $('creatorModal').classList.remove('show');
  toast('🎮 角色建立完成！跟著左上方任務練習吧！');
  setTimeout(spawnOrder, 1500);
}
window.finishCreator = finishCreator;

const chapters = [
  { title: '第一章：今天也要活下去 (樹林新手村)', body: '樹林街頭充滿了急躁的車潮與人情味店家。先在新手村掌握打狗、補體、接單與避開碰撞的基本功！' },
  { title: '第二章：尖峰車潮突圍', body: '上下班尖峰時刻，馬路上車水馬龍。考驗你的路線判斷與煞車技術！' },
  { title: '第三章：03:17 時間異常', body: '深夜的街道突然安靜，周遭車輛彷彿凝固... 手機傳來神祕訊息：你是在賺錢，還是拿生活換錢？' }
];
let currentChapter = 0;

function renderStory() {
  const c = chapters[currentChapter];
  $('storyTitle').textContent = c.title;
  $('storyBody').textContent = c.body;
  $('prevBtn').disabled = currentChapter === 0;
  $('nextBtn').disabled = currentChapter === chapters.length - 1;
}
function prevChapter() { if (currentChapter > 0) { currentChapter--; renderStory(); } }
function nextChapter() { if (currentChapter < chapters.length - 1) { currentChapter++; renderStory(); } }
window.prevChapter = prevChapter; window.nextChapter = nextChapter;

function selectLevel(lvl) {
  currentChapter = lvl;
  $('storyModal').classList.remove('show');
  if (lvl === 0) {
    player.x = 330; player.y = 330;
    toast('🚀 已切換至【第一關：新手村】');
  } else if (lvl === 1) {
    player.x = 1000; player.y = 520;
    toast('🚀 已切換至【第二關：尖峰車潮突圍】');
  } else {
    gameMinutes = 197; // 03:17
    toast('⌛ 已切換至【第三關：03:17 時間異常】');
  }
}
window.selectLevel = selectLevel;

/* ================= 4. 點擊地面移動 ＋ 【快點兩下直接確認/互動】 ================= */
let lastTapTime = 0;
let lastTapTarget = null;

canvas.addEventListener('pointerdown', e => {
  if (document.querySelector('.overlay.show')) return;
  initAudio();

  const c = { x: player.x - W/2, y: player.y - H/2 };
  const clickWorldX = e.clientX + c.x;
  const clickWorldY = e.clientY + c.y;

  const now = Date.now();
  // 檢測是否快點兩下（Double Tap / Double Click）在同一目的地周遭
  if (now - lastTapTime < 350) {
    // 檢查點擊處是否靠近當前目標點、店家、家或顧客
    const activeTgt = activeTarget();
    if (activeTgt) {
      const dist = Math.hypot(clickWorldX - (activeTgt.x + activeTgt.w/2), clickWorldY - (activeTgt.y + activeTgt.h/2));
      if (dist < 120) {
        // 雙擊直接進行取送餐
        interact();
        lastTapTime = 0;
        return;
      }
    }
    // 檢查是否雙擊在小窩或加油站
    for (const p of places) {
      if (Math.hypot(clickWorldX - (p.x + p.w/2), clickWorldY - (p.y + p.h/2)) < 90) {
        interact();
        lastTapTime = 0;
        return;
      }
    }
  }
  lastTapTime = now;

  // 設定移動目標波紋
  player.target = {
    x: Math.max(20, Math.min(map.w - 20, clickWorldX)),
    y: Math.max(20, Math.min(map.h - 20, clickWorldY))
  };
});

/* ================= 5. 精準指引導航與公尺計算 ================= */
function activeTarget() {
  if (!player.order) return null;
  return player.order.stage === 'pickup' ? player.order.shop : player.order.target;
}

function updateNavIndicator() {
  const t = activeTarget();
  if (!t) {
    $('nav').style.display = 'none';
    return;
  }
  $('nav').style.display = 'flex';
  const tx = t.x + t.w / 2;
  const ty = t.y + t.h / 2;
  const dx = tx - player.x;
  const dy = ty - player.y;
  const dist = Math.round(Math.hypot(dx, dy));

  const angleRad = Math.atan2(dy, dx);
  const angleDeg = angleRad * (180 / Math.PI);

  // 精準旋轉箭頭
  $('navArrow').style.transform = `rotate(${angleDeg - 90}deg)`;
  $('navText').textContent = (player.order.stage === 'pickup' ? '前往取餐：' : '送往顧客：') + t.name;
  $('navDist').textContent = `${dist}m (到達後快點兩下確認)`;
}

/* ================= 6. 車輛碰撞反應 (扣車損 + 扣體力) ================= */
let hitCooldown = 0;
function checkCarCollisions(dt) {
  if (hitCooldown > 0) { hitCooldown -= dt; return; }

  cars.forEach(car => {
    const dist = Math.hypot(player.x - car.x, player.y - car.y);
    if (dist < 26) {
      // 發生實質撞擊
      player.hp = Math.max(0, player.hp - 12);
      player.durability = Math.max(0, player.durability - 15);
      hitCooldown = 0.8; // 0.8秒無敵防重複扣

      // 彈開大叔
      const ang = Math.atan2(player.y - car.y, player.x - car.x);
      player.x += Math.cos(ang) * 45;
      player.y += Math.sin(ang) * 45;
      player.target = null; // 中斷點擊尋路

      playHitSound();
      updateHUD();
      toast('💥 發生車禍！車損 -15%，體力 -12%！');
      advanceQuest(2); // 完成撞車練習
    }
  });
}

/* ================= 7. 外送派單流程 ================= */
let offer = null;
function spawnOrder() {
  if (player.order || offer || document.querySelector('.overlay.show')) return;
  const shop = Math.random() > 0.5 ? places[1] : places[2];
  const target = Math.random() > 0.5 ? places[4] : places[5];
  offer = { shop, target, reward: 75 + Math.floor(Math.random() * 40) };
  $('orderDesc').textContent = `店家：${shop.name} ➔ 送至：${target.name}`;
  $('reward').textContent = `配送工資：$${offer.reward}`;
  $('orderModal').classList.add('show');
}
window.spawnOrder = spawnOrder;

function accept() {
  if (!offer) return;
  player.order = { ...offer, stage: 'pickup' };
  offer = null;
  $('orderModal').classList.remove('show');
  toast('📦 接單成功！請跟隨箭頭前往店家，到達後快點兩下取餐！');
  updateNavIndicator();
}
function reject() {
  offer = null;
  $('orderModal').classList.remove('show');
  toast('已拒絕訂單。');
}
window.accept = accept; window.reject = reject;

/* ================= 8. 互動與取送餐 (支援按鈕與雙擊) ================= */
function interact() {
  // 檢查小窩
  if (Math.hypot(player.x - (places[0].x + places[0].w/2), player.y - (places[0].y + places[0].h/2)) < 90) {
    $('homeModal').classList.add('show');
    return;
  }
  // 檢查加油站
  if (Math.hypot(player.x - (places[3].x + places[3].w/2), player.y - (places[3].y + places[3].h/2)) < 90) {
    player.gas = 100;
    updateHUD();
    toast('⛽ 汽油加滿！');
    advanceQuest(5); // 完成加油練習
    return;
  }
  // 檢查機車行
  if (Math.hypot(player.x - (places[6].x + places[6].w/2), player.y - (places[6].y + places[6].h/2)) < 90) {
    $('garageModal').classList.add('show');
    return;
  }

  if (!player.order) {
    toast('目前沒有正在進行的訂單。');
    return;
  }

  const t = activeTarget();
  const d = Math.hypot(player.x - (t.x + t.w/2), player.y - (t.y + t.h/2));
  if (d > 110) {
    toast('📍 還沒到達目的地喔！靠近後再快點兩下！');
    return;
  }

  if (player.order.stage === 'pickup') {
    player.order.stage = 'deliver';
    toast(`📦 取餐成功！接著送往【${player.order.target.name}】！`);
    updateNavIndicator();
  } else {
    player.money += player.order.reward;
    player.done++;
    player.order = null;
    updateHUD();
    updateNavIndicator();
    toast('🎉 配送完成！工資已入帳！');
    advanceQuest(4); // 完成接單送達練習
    setTimeout(spawnOrder, 3500);
  }
}
window.interact = interact;

/* ================= 9. 道具、食物引狗與便當 ================= */
function throwFood() {
  const w = weapons[wi];
  if (w.qty <= 0) {
    wi = (wi + 1) % weapons.length;
    updateHUD();
    toast(`切換為【${weapons[wi].name}】`);
    return;
  }
  w.qty--;
  foods.push({
    x: player.x, y: player.y,
    vx: Math.cos(player.angle) * 260,
    vy: Math.sin(player.angle) * 260,
    life: 1.5,
    stun: w.stun,
    icon: w.icon
  });
  updateHUD();
}
window.throwFood = throwFood;

function eatBento() {
  if (player.bento <= 0) {
    toast('便當吃光了！請回家備餐或去便當店購買。');
    return;
  }
  if (player.hp >= 100) {
    toast('體力滿格，現在吃不下。');
    return;
  }
  player.bento--;
  player.hp = Math.min(100, player.hp + 45);
  updateHUD();
  toast('🍱 大口吃便當！體力恢復 45%！');
  advanceQuest(3); // 完成吃便當練習
}
window.eatBento = eatBento;

/* ================= 10. 車行升級與小窩功能 ================= */
function buyVehicle(lvl, cost) {
  if (player.money >= cost) {
    player.money -= cost;
    player.vehLvl = lvl;
    player.speed = lvl === 1 ? 220 : 280;
    player.durability = 100;
    updateHUD();
    $('garageModal').classList.remove('show');
    toast('🛵 恭喜換新車！速度飆升！');
    advanceQuest(6); // 完成換車練習
  } else {
    alert('現金不足喔！多跑幾單再來吧！');
  }
}
window.buyVehicle = buyVehicle;

function sleepHome() {
  player.hp = 100;
  player.durability = 100;
  player.gas = 100;
  updateHUD();
  $('homeModal').classList.remove('show');
  toast('🛌 睡了大覺，體力、車況與汽油全數回滿！');
}
window.sleepHome = sleepHome;

function cookHome() {
  if (player.money >= 35) {
    player.money -= 35;
    player.bento++;
    weapons[0].qty += 2;
    updateHUD();
    toast('🍳 備餐完成！便當 +1，珍珠奶茶 +2！');
  } else toast('錢不夠買食材！');
}
window.cookHome = cookHome;

function playLottery() {
  if (player.money >= 50) {
    player.money -= 50;
    const win = Math.random() < 0.35 ? 150 : 0;
    player.money += win;
    updateHUD();
    toast(win > 0 ? `🎉 刮中大獎 $${win}！` : '銘謝惠顧，再接再厲！');
  } else toast('錢不夠買彩券！');
}
window.playLottery = playLottery;

/* ================= 11. HUD 與通知 ================= */
function toast(s) {
  $('toast').textContent = s;
  $('toast').style.display = 'block';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => $('toast').style.display = 'none', 2400);
}

function updateHUD() {
  $('money').textContent = Math.floor(player.money);
  $('hp').textContent = Math.round(player.hp);
  $('durability').textContent = Math.round(player.durability);
  $('gas').textContent = Math.round(player.gas);
  $('bentoCount').textContent = player.bento;
  $('foodCount').textContent = weapons[wi].qty;
  $('food').innerHTML = `${weapons[wi].icon} ${weapons[wi].name} ×<span id="foodCount">${weapons[wi].qty}</span>`;
}

/* ================= 12. 虛擬搖桿與鍵盤事件 ================= */
const stick = $('stick'), knob = $('knob');
stick.addEventListener('pointerdown', e => {
  e.preventDefault();
  joy.on = true;
  player.target = null;
  stick.setPointerCapture(e.pointerId);
  moveJoy(e);
});
stick.addEventListener('pointermove', e => { if (joy.on) moveJoy(e); });
function moveJoy(e) {
  const r = stick.getBoundingClientRect();
  const dx = e.clientX - r.left - r.width / 2;
  const dy = e.clientY - r.top - r.height / 2;
  const l = Math.hypot(dx, dy);
  const cap = Math.min(32, l);
  const x = l ? dx / l * cap : 0;
  const y = l ? dy / l * cap : 0;
  joy.x = x / 32; joy.y = y / 32;
  knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
}
function stopJoy() {
  joy.on = false; joy.x = 0; joy.y = 0;
  knob.style.transform = 'translate(-50%, -50%)';
}
stick.addEventListener('pointerup', stopJoy);
stick.addEventListener('pointercancel', stopJoy);

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'e' || k === ' ') interact();
  if (k === 'b') eatBento();
  if (k === 'j') throwFood();
  if (k === 'q') { wi = (wi + 1) % weapons.length; updateHUD(); toast(`切換為【${weapons[wi].name}】`); }
  if (k === 'y') accept();
  if (k === 'n') reject();
  if (k === 'escape') document.querySelectorAll('.overlay.show').forEach(x => x.classList.remove('show'));
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

$('helpBtn').onclick = () => alert('📱 手機：\n• 點擊地面移動\n• 到目的地後【快點兩下】即可確認取餐/送達！\n• 右下按鈕可吃便當、丟珍奶引狗。\n\n💻 電腦：\n• WASD/方向鍵移動\n• 空白鍵/E 互動\n• B 吃便當、J 丟食物、Q 切換武器');
$('storyBtn').onclick = () => { renderStory(); $('storyModal').classList.add('show'); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).classList.remove('show'));

/* ================= 13. 主更新與繪圖迴圈 ================= */
function update(dt) {
  // 時間推移 (年月日時分)
  gameMinutes = (gameMinutes + dt * 2.5) % 1440;
  if (gameMinutes < dt * 2.5) {
    gameDay++;
    if (gameDay > 30) { gameDay = 1; gameMonth++; }
    if (gameMonth > 12) { gameMonth = 1; gameYear++; }
  }
  const hh = String(Math.floor(gameMinutes / 60)).padStart(2, '0');
  const mm = String(Math.floor(gameMinutes % 60)).padStart(2, '0');
  $('dateText').textContent = `${gameYear}/${String(gameMonth).padStart(2,'0')}/${String(gameDay).padStart(2,'0')}`;
  $('clock').textContent = `${hh}:${mm}`;

  // 車輛移動
  cars.forEach(c => {
    c.x += c.v * dt;
    if (c.x > map.w + 40) c.x = -40;
    if (c.x < -40) c.x = map.w + 40;
  });

  checkCarCollisions(dt);

  // 野狗邏輯
  dogs.forEach(d => {
    if (d.stun > 0) { d.stun -= dt; return; }
    d.x += d.v * dt;
    if (d.x < 500 || d.x > 1650) d.v *= -1;
    if (Math.hypot(player.x - d.x, player.y - d.y) < 28) {
      player.hp = Math.max(0, player.hp - 12 * dt);
      updateHUD();
    }
  });

  // 投擲食物飛行
  foods.forEach(f => {
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.life -= dt;
    dogs.forEach(d => {
      if (Math.hypot(d.x - f.x, d.y - f.y) < 32) {
        d.stun = f.stun;
        f.life = 0;
        toast(`🍖 食物引開了野狗，定身 ${f.stun} 秒！`);
        advanceQuest(1); // 完成打狗練習
      }
    });
  });
  foods = foods.filter(f => f.life > 0);

  // 移動計算 (搖桿 優先於 點擊地面)
  let mx = 0, my = 0;
  if (joy.on) {
    mx = joy.x; my = joy.y;
  } else {
    if (keys.w || keys.arrowup) my--;
    if (keys.s || keys.arrowdown) my++;
    if (keys.a || keys.arrowleft) mx--;
    if (keys.d || keys.arrowright) mx++;
  }

  if (mx || my) {
    const l = Math.hypot(mx, my);
    player.angle = Math.atan2(my, mx);
    player.target = null;
    player.x += (mx / l) * player.speed * dt;
    player.y += (my / l) * player.speed * dt;
  } else if (player.target) {
    const dx = player.target.x - player.x;
    const dy = player.target.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d < 8) {
      player.target = null;
    } else {
      player.angle = Math.atan2(dy, dx);
      player.x += Math.cos(player.angle) * player.speed * dt;
      player.y += Math.sin(player.angle) * player.speed * dt;
    }
  }

  player.x = Math.max(20, Math.min(map.w - 20, player.x));
  player.y = Math.max(20, Math.min(map.h - 20, player.y));

  // 汽油消耗
  if (player.gas > 0 && (mx || my || player.target)) {
    player.gas = Math.max(0, player.gas - dt * 0.12);
  }

  updateNavIndicator();
  updateHUD();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const cam = { x: player.x - W / 2, y: player.y - H / 2 };

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // 大地圖背景
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, map.w, map.h);

  // 道路網
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 500, map.w, 140);
  ctx.fillRect(700, 0, 130, map.h);
  ctx.fillRect(1500, 0, 130, map.h);

  // 道路虛線
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 3;
  ctx.setLineDash([16, 16]);
  ctx.beginPath();
  ctx.moveTo(0, 570); ctx.lineTo(map.w, 570);
  ctx.moveTo(765, 0); ctx.lineTo(765, map.h);
  ctx.moveTo(1565, 0); ctx.lineTo(1565, map.h);
  ctx.stroke();
  ctx.setLineDash([]);

  // 地標設施
  for (const p of places) {
    ctx.fillStyle = p.type === 'home' ? '#2563eb' : (p.type === 'gas' ? '#059669' : (p.type === 'garage' ? '#7c3aed' : '#d97706'));
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 10);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 13px system-ui';
    ctx.fillText(p.icon + ' ' + p.name, p.x + 8, p.y + p.h / 2 + 5);
  }

  // 導航光圈
  const tgt = activeTarget();
  if (tgt) {
    ctx.strokeStyle = player.order.stage === 'pickup' ? '#f59e0b' : '#10b981';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(tgt.x + tgt.w/2, tgt.y + tgt.h/2, 42 + Math.sin(performance.now() / 150) * 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 車輛
  for (const car of cars) {
    ctx.fillStyle = car.color;
    ctx.beginPath();
    ctx.roundRect(car.x - car.w/2, car.y - car.h/2, car.w, car.h, 5);
    ctx.fill();
  }

  // 野狗
  for (const d of dogs) {
    ctx.font = '22px sans-serif';
    ctx.fillText(d.stun > 0 ? '💤' : '🐕', d.x - 10, d.y + 8);
  }

  // 投擲食物
  for (const f of foods) {
    ctx.font = '20px sans-serif';
    ctx.fillText(f.icon, f.x - 10, f.y + 7);
  }

  // 點擊移動綠色波紋
  if (player.target) {
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(player.target.x, player.target.y, 14 + Math.sin(performance.now() / 120) * 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 繪製主角車輛
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // 機車 (阿豪藍 / 妮野可粉紅)
  ctx.fillStyle = player.gender === 'F' ? '#ec4899' : '#2563eb';
  ctx.beginPath();
  ctx.roundRect(-16, -10, 32, 20, 5);
  ctx.fill();

  // 保溫箱
  ctx.fillStyle = player.order ? '#10b981' : '#f59e0b';
  ctx.fillRect(-22, -12, 12, 24);

  // 角色頭
  ctx.fillStyle = player.gender === 'F' ? '#f472b6' : '#fed7aa';
  ctx.beginPath();
  ctx.arc(4, 0, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
  ctx.restore();
}

function loop(t) {
  const dt = Math.min(0.04, (t - last) / 1000 || 0);
  last = t;
  if (!$('creatorModal').classList.contains('show')) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

updateHUD();
})();
</script>
